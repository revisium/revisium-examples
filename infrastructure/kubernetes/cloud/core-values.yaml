replicaCount: 2

image:
  repository: revisium/revisium-core
  tag: "v2.9.2"
  pullPolicy: IfNotPresent

container:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  - name: PUBLIC_URL
    value: "https://cloud.example.com"
  - name: COOKIE_SECURE
    value: "true"
  - name: COOKIE_SAMESITE
    value: "lax"
  - name: CORS_ORIGIN
    value: "https://cloud.example.com"
  - name: TRUST_PROXY
    value: "2"
  # Redis is also the endpoint notification bus; the env name is legacy.
  - name: ENDPOINT_HOST
    value: "cloud-redis"
  - name: ENDPOINT_PORT
    value: "8080"
  - name: CACHE_ENABLED
    value: "true"
  - name: CACHE_L1_MAX_SIZE
    value: "128mb"
  - name: CACHE_L2_REDIS_URL
    value: "redis://cloud-redis:8080/1"
  - name: CACHE_BUS_HOST
    value: "cloud-redis"
  - name: CACHE_BUS_PORT
    value: "8080"
  - name: FILE_PLUGIN_PUBLIC_ENDPOINT
    value: "https://cdn.example.com"
  - name: S3_ENDPOINT
    value: "https://s3.example.com"
  - name: S3_REGION
    value: "us-east-1"
  - name: S3_BUCKET
    value: "cloud-example"
  - name: S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: S3_ACCESS_KEY_ID
        optional: false
  - name: S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: S3_SECRET_ACCESS_KEY
        optional: false
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: DATABASE_URL
        optional: false
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: JWT_SECRET
        optional: false
  - name: ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: ADMIN_PASSWORD
        optional: false
  - name: ENDPOINT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: ENDPOINT_PASSWORD
        optional: false
  - name: INTERNAL_API_KEY_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: INTERNAL_API_KEY_ENDPOINT
        optional: false

startupProbe:
  httpGet:
    path: /health/readiness
    port: 8080
  failureThreshold: 60
  periodSeconds: 5
  timeoutSeconds: 2

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8080
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
