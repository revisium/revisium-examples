replicaCount: 1

image:
  repository: revisium/revisium-admin
  tag: "v2.5.2"
  pullPolicy: IfNotPresent

container:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  ingressClassName: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: "cloud.example.com"
      paths:
        - path: /endpoint
          pathType: Prefix
          backend:
            service:
              # endpoint chart name is "application", so release cloud-endpoint renders this service name.
              name: cloud-endpoint-application
              port: 80
        - path: /
          pathType: Prefix
  tls:
    enabled: true

env:
  REACT_APP_GRAPHQL_SERVER_URL: /graphql
  REACT_APP_SWAGGER_SERVER_URL: /api
  REACT_APP_GRAPHQL_SERVER_HOST: cloud-core-application.cloud.svc.cluster.local
  REACT_APP_GRAPHQL_SERVER_PORT: 80
  REACT_APP_ENDPOINT_HOST: ""
  REACT_APP_ENDPOINT_PORT: ""
