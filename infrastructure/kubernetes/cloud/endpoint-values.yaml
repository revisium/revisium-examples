replicaCount: 2

image:
  repository: revisium/revisium-endpoint
  tag: "v2.5.1"
  pullPolicy: IfNotPresent

container:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: DATABASE_URL
        optional: false
  # Redis is also the endpoint notification bus; the env name is legacy.
  - name: ENDPOINT_HOST
    value: "cloud-redis"
  - name: ENDPOINT_PORT
    value: "8080"
  - name: CORE_API_URL
    value: "http://cloud-core-application.cloud.svc.cluster.local:80"
  - name: INTERNAL_API_KEY_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: app-secret
        key: INTERNAL_API_KEY_ENDPOINT
        optional: false

startupProbe:
  httpGet:
    path: /health/readiness
    port: 8080
  failureThreshold: 60
  periodSeconds: 5
  timeoutSeconds: 2

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8080
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
